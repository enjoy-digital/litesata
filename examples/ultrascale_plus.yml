{
    # PHY ----------------------------------------------------------------------
    # GTH4SATAPHY: UltraScale+ GTH (Artix/Kintex/Zynq UltraScale+, GTHE4).
    # GTY4SATAPHY: UltraScale+ GTY (Kintex/Virtex UltraScale+,     GTYE4).
    # GTH3SATAPHY: UltraScale  GTH (Kintex/Virtex UltraScale,      GTHE3).
    "phy": "GTH4SATAPHY",
    "gen": "gen3",

    # PHY datapath width (16 or 32) and UltraScale+ GT type override (GTH/GTY).
    # "data_width": 16,
    # "gt_type":    "GTH",

    # Frequency ----------------------------------------------------------------
    "clk_freq": 150e6,

    # User Ports ---------------------------------------------------------------
    "user_ports": {
        "native_0" : {
            "type": "native",
            "data_width": 32,
        },
    },
}
